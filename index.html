<!DOCTYPE html>
<html>
<head>
  <title>My Audio Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-box">

    <div class="cover">🎵</div>

    <h2 id="songName">Song Name</h2>
    <p id="artistName">Artist Name</p>

    <audio id="myAudio"></audio>

    <div class="progress-area" onclick="seek(event)">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <p class="time-text">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </p>

    <button onclick="prevSong()">⏮ Prev</button>
    <button onclick="playPause()" id="playBtn">▶ Play</button>
    <button onclick="nextSong()">Next ⏭</button>

    <br><br>

    <label>Volume:</label>
    <input type="range" id="volumeControl" min="0" max="100" value="80" onchange="changeVolume()">

    <h3>Playlist</h3>
    <ul id="playlist"></ul>

  </div>

  <script src="script.js"></script>
</body>
</html>
